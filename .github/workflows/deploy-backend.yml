name: Deploy MiniCanvas Backend

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/MiniCanvasProject:latest

  deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
          - name: Deploy to VPS via SSH
            uses: appleboy/ssh-action@v1.0.3
            with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                script: |
                  # Login to Docker Hub on the VPS
                  echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
                  
                  # Pull the latest image
                  docker pull ${{ secrets.DOCKER_USERNAME }}/MiniCanvasProject:latest
                  
                  # Stop and remove existing container if it exists
                  docker stop my-running-app || true
                  docker rm my-running-app || true
                  
                  # Run the new container
                  # -p 80:8080 maps VPS port 80 to Docker port 8080 (ASP.NET default)
                  docker run -d \
                    --name my-running-app \
                    --restart always \
                    -p 80:8080 \
                    ${{ secrets.DOCKER_USERNAME }}/MiniCanvasProject:latest

#          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "/opt/backend-minicanvas/deploy.sh"