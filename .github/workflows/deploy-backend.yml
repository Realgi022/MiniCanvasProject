name: Deploy MiniCanvas Backend

on:
  workflow_run:
    workflows: [ "CI" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: . # This looks at the root where your build.gradle.kts is
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/minicanvasproject:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Login to Docker Hub on the VPS
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull the latest Java image
            docker pull ${{ secrets.DOCKER_USERNAME }}/minicanvasproject:latest
            
            # Stop and remove existing container
            docker stop minicanvas-backend || true
            docker rm minicanvas-backend || true
            
            # Run the container
            # Java Spring Boot usually runs on 8080 internally
            docker run -d \
              --name minicanvas-backend \
              --restart always \
              -p 80:8080 \
              ${{ secrets.DOCKER_USERNAME }}/minicanvasproject:latest

#          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "/opt/backend-minicanvas/deploy.sh"