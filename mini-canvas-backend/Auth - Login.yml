info:
  name: Auth - Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8081/auth/login
  body:
    type: json
    data: |-
      {
        "email": "realgihila@gmail.com",
        "password": "123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.token) {
          bru.setEnvVar("token", body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
