spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS dbo\;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=dbo

spring.flyway.enabled=false

app.jwt.secret=THIS_IS_A_TEST_SECRET_KEY_THAT_IS_LONG_ENOUGH_FOR_JJWT_TESTS_123456789
app.jwt.expiration-minutes=60